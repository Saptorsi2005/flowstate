<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Site Blocked — FlowState</title>
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="pages.css" />
</head>

<body>
  <div class="page-center">
    <div class="page-icon">🚫</div>
    <h1 id="page-title">Site Blocked</h1>
    <p class="blocked-url" id="blocked-url"></p>
    <p class="page-msg" id="page-msg">This site is blocked while your workspace is active.</p>

    <div id="countdown-section" class="hidden">
      <p class="countdown-label">Access approved! Unlocking in…</p>
      <div class="countdown-ring">
        <span id="countdown">15</span>
      </div>
      <button id="btn-unlock" disabled>Unlock Site</button>
    </div>

    <!-- Safe exit button — always visible -->
    <button id="btn-stay" class="btn-stay" style="margin-top: 24px;">Stay Focused</button>
  </div>

  <script src="blocked.js"></script>
</body>

</html>
