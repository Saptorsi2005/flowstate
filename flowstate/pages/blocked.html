<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Site Blocked — FlowState</title>
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="pages.css" />
</head>
<body>
  <div class="page-center">
    <div class="page-icon">🚫</div>
    <h1>Site Blocked</h1>
    <p class="blocked-url" id="blocked-url"></p>
    <p class="page-msg">This site is blocked while your workspace is active.</p>

    <div id="unlock-section">
      <p class="countdown-label">Need access? Wait for the countdown.</p>
      <div class="countdown-ring">
        <span id="countdown">15</span>
      </div>
      <button id="btn-unlock" disabled>Unlock Site</button>
    </div>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
