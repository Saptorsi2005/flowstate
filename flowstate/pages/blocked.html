<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Site Blocked — FlowState</title>
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="pages.css" />
</head>

<body>
  <div class="page-center">
    <div class="page-icon">🚫</div>
    <h1 id="page-title">Site Blocked</h1>
    <p class="blocked-url" id="blocked-url"></p>
    <p class="page-msg" id="page-msg">This site is blocked while your workspace is active.</p>


    <!-- Action buttons (visibility controlled by JS based on focus mode) -->
    <div class="button-group">
      <button id="btn-stay" class="btn-primary">Stay Focused</button>
      <button id="btn-continue" class="btn-secondary">Continue Anyway</button>
    </div>

  </div>

  <script src="blocked.js"></script>
</body>

</html>
