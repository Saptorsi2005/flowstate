<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stay Focused? — FlowState</title>
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="pages.css" />
</head>
<body>
  <div class="page-center">
    <div class="page-icon">⚡</div>
    <h1>Hold On</h1>
    <p>You're about to visit:</p>
    <p class="blocked-url" id="target-url"></p>
    <p class="page-msg">This site is on your blocked list. Are you sure?</p>

    <div class="button-row">
      <button id="btn-stay" class="btn-stay">Stay Focused</button>
      <button id="btn-continue" class="btn-continue">Continue Anyway</button>
    </div>
  </div>

  <script src="soft-redirect.js"></script>
</body>
</html>
